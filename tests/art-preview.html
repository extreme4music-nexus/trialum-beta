<!doctype html><html lang="mk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TRIALUM 1.5 — Character rendering QA</title>
<style>*{box-sizing:border-box}body{margin:0;display:grid;place-items:center;min-height:100vh;background:#071b30;color:#dcf9f0;font:16px system-ui}canvas{max-width:100vw;max-height:95vh;box-shadow:0 20px 90px #001a27;border-radius:20px}</style>
</head><body><canvas id="evol" width="1220" height="650"></canvas>
<script src="../js/creature-art.js"></script><script>
const canvas=document.getElementById('evol'),ctx=canvas.getContext('2d');
const C=(h,s,l,a=1)=>'hsla('+h+','+s+'%,'+l+'%,'+a+')';
function draw(t){
 const bg=ctx.createLinearGradient(0,0,0,650);bg.addColorStop(0,'#092f4d');bg.addColorStop(.7,'#115b64');bg.addColorStop(1,'#153e47');ctx.fillStyle=bg;ctx.fillRect(0,0,1220,650);
 for(let i=0;i<130;i++){const x=(i*197)%1220,y=(i*113-t*8)%650,r=1+(i%6)/2;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fillStyle='#d3fff333';ctx.fill();}
 ctx.font='800 36px system-ui';ctx.fillStyle='#e6fff6';ctx.textAlign='center';ctx.fillText('ТРИАЛУМ · ЕВОЛУЦИЈА НА ЖИВИОТ СВЕТ',610,54);
 const pets=[
  {name:'Лумира · Ниво 28',species:0,shape:'jelly',hue:162,growth:35,seed:3,eyes:2,evolution:{level:28}},
  {name:'Лумира · Ниво 80',species:0,shape:'jelly',hue:165,growth:76,seed:3,eyes:2,evolution:{level:80}},
  {name:'Лумира · Ниво 161',species:0,shape:'jelly',hue:171,growth:96,seed:3,eyes:2,evolution:{level:161}}
 ];
 const at=[{x:220,y:346,size:.85},{x:610,y:346,size:.91},{x:971,y:346,size:.93}];
 pets.forEach((p,i)=>{ctx.save();TrialumCreatureArt.draw(ctx,p,at[i],t,false,{level:p.evolution.level},i===2?{skill:'wave',start:0,duration:2.1}:null);ctx.restore()});
 ctx.fillStyle='#f1fff9';ctx.font='16px system-ui';ctx.fillText('Постепено израснување · независен изглед, светло и текстура',610,611);
}
draw(1.1);
</script></body></html>
