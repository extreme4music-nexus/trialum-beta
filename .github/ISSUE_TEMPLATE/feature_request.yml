name: Feature suggestion
description: Propose a gameplay or accessibility idea
title: "[Idea] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Suggestions only. Do not post proprietary code, private data, or third-party assets. Ideas do not grant code write access."
  - type: textarea
    id: idea
    attributes:
      label: Suggestion
    validations:
      required: true
  - type: textarea
    id: benefit
    attributes:
      label: Benefit for players
