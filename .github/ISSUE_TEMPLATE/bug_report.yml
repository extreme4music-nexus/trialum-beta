name: Bug report
description: Report a reproducible problem in an officially published beta
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not disclose personal data, credentials, or security vulnerabilities in public Issues. See SECURITY.md."
  - type: input
    id: beta
    attributes:
      label: Beta version
      placeholder: "e.g. 1.6.0-beta.1"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
