name: ONE-TIME Trialum v44 owner SOCIAL test APK (ephemeral gate)
on:
  push:
    branches:
      - feature/v44-owner-hud-economy-guidance-20261122
    paths:
      - .github/workflows/v44-one-time-social-qa.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trialum-v44-one-time-social-test
  cancel-in-progress: false
jobs:
  isolated-owner-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify official version, offline licensing and TEST-ONLY patch boundaries
        run: |
          node --test tests/v44-version-and-licenses.test.cjs
          node --test tests/v44-friends-age-signals.test.cjs
      - name: Apply temporary OWNER TEST ONLY patch in CI checkout, NEVER commit to repository
        run: |
          python3 - <<'PY'
          from pathlib import Path
          activity=Path("android-template/app/src/main/java/com/trialum/ziivaiskra/MainActivity.kt")
          code=activity.read_text()
          import re
          pattern=r'@JavascriptInterface\\s+fun\\s+ageSignalsAdultEligible\\(\\):\\s*Boolean\\s*=\\s*ageSignals\\.isAdultEligible\\(\\)'
          code,count=re.subn(pattern,'@JavascriptInterface fun ageSignalsAdultEligible(): Boolean = true',code,count=1)
          if count!=1: raise SystemExit("Age Signals bridge changed: refuse temporary social patch")
          code=code.replace('@JavascriptInterface fun ageSignalsAdultEligible(): Boolean = true',
              '// CI-ONLY QA social test; never published.\\n        @JavascriptInterface fun ageSignalsAdultEligible(): Boolean = true',1)
          activity.write_text(code)
          gradle=Path("android-template/app/build.gradle.kts")
          code=gradle.read_text()
          before='applicationIdSuffix = ".qa44"'
          if code.count(before)!=1: raise SystemExit("QA app ID changed: fail closed")
          code=code.replace(before,'applicationIdSuffix = ".qa44social"',1)
          before='manifestPlaceholders["trialumInviteScheme"] = "trialum-qa44"'
          if code.count(before)!=1: raise SystemExit("QA invitation scheme changed")
          code=code.replace(before,'manifestPlaceholders["trialumInviteScheme"] = "trialum-qa44social"',1)
          gradle.write_text(code)
          social=Path("js/social.js")
          code=social.read_text()
          before="  html+='<p class=\"desc\">'"
          if code.count(before)!=1: raise SystemExit("Social notice anchor changed")
          warning="  html+='<div class=\"notice social-warning\" role=\"status\">"
          warning+="⚠ OWNER-ONLY TEST APK: Google age check is temporarily bypassed in this isolated package. "
          warning+="Do not distribute. Social consent and profile creation are still required. "
          warning+="This does not validate production age eligibility or server security.</div>';\n"
          code=code.replace(before,warning+before,1)
          social.write_text(code)
          assert 'ageSignalsAdultEligible(): Boolean = true' in activity.read_text()
          assert 'applicationIdSuffix = ".qa44social"' in gradle.read_text()
          print("Temporary CI-checkout-only social test gate installed; original release branch source unchanged.")
          PY
      - name: Require configured HTTPS backend (no hardcoded or guessed social address)
        run: |
          set -euo pipefail
          : "${TRIALUM_SOCIAL_API_URL:?TRIALUM_SOCIAL_API_URL repository variable is required for useful social QA}"
          [[ "$TRIALUM_SOCIAL_API_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?$ ]] || exit 1
      - name: Build random-signed, separate com.trialum.ziivaiskra.qa44social APK
        run: |
          gradle -p android-template :app:assembleQa44 --no-daemon --stacktrace \
            "-PtrialumSocialApiUrl=$TRIALUM_SOCIAL_API_URL"
      - name: Verify Android signature, app id and ALL offline licensing resources
        run: |
          set -euo pipefail
          APK=android-template/app/build/outputs/apk/qa44/app-qa44.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.trialum.ziivaiskra.qa44social'"
          "$AAPT" dump badging "$APK" | grep -F "versionName='1.4 v44-qa44'"
          for asset in licenses/MODEL-LICENSES.md licenses/THIRD-PARTY-NOTICES.txt \
             licenses/ANDROID-DEPENDENCY-LICENSES.json licenses/APACHE-2.0.txt \
             licenses/ZZFX-MIT.txt licenses/llama-android-0.1.1/LICENSE \
             licenses/llama-android-0.1.1/THIRD-PARTY-NOTICES.txt; do
            unzip -Z1 "$APK" | grep -Fx "assets/$asset" >/dev/null || { echo "::error::Missing offline license $asset"; exit 1; }
          done
          unzip -p "$APK" assets/licenses/ANDROID-DEPENDENCY-LICENSES.json | python3 -c 'import json,sys; r=json.load(sys.stdin); assert len(r["dependencies"])>=5; print("Offline license inventory checked; entries:",len(r["dependencies"]))'
          mkdir -p qa-social
          cp "$APK" qa-social/Trialum-1.4-v44-OWNER-ONLY-SOCIAL-QA-random-signed.apk
          (cd qa-social && sha256sum *.apk > SHA256SUMS.txt)
          printf '%s\n' \
            'ONE-TIME OWNER SOCIAL QA, DO NOT DISTRIBUTE. Not authorized for public Play release.' \
            'Only in this temporary QA binary: Google Age Signals eligibility is simulated.' \
            'This does NOT authorize bypassing safeguards in the real Play release.' \
            'User social consent and profile registration are still required.' \
            'The social HTTPS backend is configured using a protected repository variable.' \
            'The APK is signed with a disposable debug key, has separate package and data.' \
            'Play Games and FCM are disabled in this disposable sideloaded variant.' \
            'Offline third-party license notices are included in this build.' \
            > qa-social/READ-ME-ONE-TIME-OWNER-QA.txt
          cat qa-social/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Trialum-v44-ONE-TIME-OWNER-SOCIAL-QA-APK
          path: qa-social/
          retention-days: 14
          if-no-files-found: error
