name: V44 Android social attestation app gate
on:
  push:
    branches:
      - fix/v44-android-social-attestation-20261123
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: social-attestation-app-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  social-app-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify application JavaScript syntax
        run: |
          node --check js/social.js
          node --check js/messages.js
          node --check js/shared-playground.js
          node --check js/app.js
          node --check js/legal-consent.js
      - name: Run social eligibility, recovery and original age/privacy regressions
        run: |
          node --test tests/v44-social-attestation.test.cjs tests/v44-friends-age-signals.test.cjs tests/v44-social-account-recovery.test.cjs tests/social-ui.test.cjs
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36 (compile only)
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile Kotlin without APK, AAB or signing
        run: gradle -p android-template :app:compileDebugKotlin --no-daemon --stacktrace
