name: Trialum LW-C beta build

on:
  pull_request:
    branches: [main]
  push:
    branches: [release/lw-c-1.6-LW-dev.12]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Client configuration only. Firebase service-account credentials and
    # server keys stay on the private social server and are never placed here.
    env:
      TRIALUM_SOCIAL_API_URL: ${{ vars.TRIALUM_SOCIAL_API_URL }}
      TRIALUM_FIREBASE_API_KEY: ${{ vars.TRIALUM_FIREBASE_API_KEY }}
      TRIALUM_FIREBASE_APP_ID: ${{ vars.TRIALUM_FIREBASE_APP_ID }}
      TRIALUM_FIREBASE_APP_ID_SIGNQA: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNQA }}
      TRIALUM_FIREBASE_APP_ID_SIGNDEBUG: ${{ vars.TRIALUM_FIREBASE_APP_ID_SIGNDEBUG }}
      TRIALUM_FIREBASE_PROJECT_ID: ${{ vars.TRIALUM_FIREBASE_PROJECT_ID }}
      TRIALUM_FIREBASE_SENDER_ID: ${{ vars.TRIALUM_FIREBASE_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install headless test dependencies
        run: npm install --no-save --ignore-scripts --no-audit jsdom@26.1.0 gifuct-js@2.1.2

      # The upstream full CI already ran all historical acceptance gates for the exact source SHA.
      # This clean export omits legacy acceptance records and owner-signing workflow by design.
      - name: Run app and LW-C regression tests
        run: |
          node tests/engine.test.cjs
          node tests/evolution.test.cjs
          node tests/progression.test.cjs
          node tests/longplay.test.cjs
          TRIALUM_LOCALE_AUDIT=1 node tests/ui.test.cjs
          node tests/creature-media.test.cjs
          node tests/play-games.test.cjs
          node tests/version155.test.cjs
          node tests/social-ui.test.cjs
          node tests/beta-contract.test.cjs
          node tests/shared-client.test.cjs
          node tests/playground.test.cjs
          node --test tests/dialogue-session.test.cjs
          node --test tests/lw-d-l3-9-original-plant-engine.test.cjs
          node --test tests/playground-ai.test.cjs
          node --test tests/dialogue-mix.test.cjs
          node --test tests/playground-memory.test.cjs
          node --test tests/presence.test.cjs
          for file in js/*.js; do node --check "$file"; done

      - name: Build unsigned APK and Play bundle candidates
        env:
          PGS_PROJECT_ID: ${{ vars.TRIALUM_PGS_PROJECT_ID }}
          PGS_ACH_FIRST_PET: ${{ vars.TRIALUM_PGS_ACH_FIRST_PET }}
          PGS_ACH_FIRST_PLANT: ${{ vars.TRIALUM_PGS_ACH_FIRST_PLANT }}
          PGS_ACH_LEARNED: ${{ vars.TRIALUM_PGS_ACH_LEARNED }}
          PGS_ACH_ADVANCED: ${{ vars.TRIALUM_PGS_ACH_ADVANCED }}
          PGS_ACH_ECOLOGY: ${{ vars.TRIALUM_PGS_ACH_ECOLOGY }}
          PGS_ACH_LAB6: ${{ vars.TRIALUM_PGS_ACH_LAB6 }}
          PGS_ACH_DNA: ${{ vars.TRIALUM_PGS_ACH_DNA }}
          PGS_BOARD_XP: ${{ vars.TRIALUM_PGS_BOARD_XP }}
          PGS_BOARD_SPECIES: ${{ vars.TRIALUM_PGS_BOARD_SPECIES }}
        run: |
          : "${TRIALUM_SOCIAL_API_URL:?Missing repository variable TRIALUM_SOCIAL_API_URL}"
          [[ "$TRIALUM_SOCIAL_API_URL" =~ ^https://[A-Za-z0-9.-]+(:443)?$ ]] || { echo "::error::Friends requires the configured HTTPS hostname"; exit 1; }
          : "${TRIALUM_FIREBASE_API_KEY:?Missing repository variable TRIALUM_FIREBASE_API_KEY}"
          : "${TRIALUM_FIREBASE_APP_ID:?Missing repository variable TRIALUM_FIREBASE_APP_ID}"
          : "${TRIALUM_FIREBASE_APP_ID_SIGNQA:?Missing repository variable TRIALUM_FIREBASE_APP_ID_SIGNQA}"
          : "${TRIALUM_FIREBASE_APP_ID_SIGNDEBUG:?Missing repository variable TRIALUM_FIREBASE_APP_ID_SIGNDEBUG}"
          : "${TRIALUM_FIREBASE_PROJECT_ID:?Missing repository variable TRIALUM_FIREBASE_PROJECT_ID}"
          : "${TRIALUM_FIREBASE_SENDER_ID:?Missing repository variable TRIALUM_FIREBASE_SENDER_ID}"
          args=()
          args+=("-PtrialumSocialApiUrl=$TRIALUM_SOCIAL_API_URL")
          args+=("-PtrialumFirebaseApiKey=$TRIALUM_FIREBASE_API_KEY")
          args+=("-PtrialumFirebaseAppId=$TRIALUM_FIREBASE_APP_ID")
          args+=("-PtrialumFirebaseAppIdSignqa=$TRIALUM_FIREBASE_APP_ID_SIGNQA")
          args+=("-PtrialumFirebaseAppIdSigndebug=$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG")
          args+=("-PtrialumFirebaseProjectId=$TRIALUM_FIREBASE_PROJECT_ID")
          args+=("-PtrialumFirebaseSenderId=$TRIALUM_FIREBASE_SENDER_ID")
          [ -n "$PGS_PROJECT_ID" ] && args+=("-PtrialumPgsProjectId=$PGS_PROJECT_ID")
          [ -n "$PGS_ACH_FIRST_PET" ] && args+=("-PtrialumPgsAchievement_first_pet=$PGS_ACH_FIRST_PET")
          [ -n "$PGS_ACH_FIRST_PLANT" ] && args+=("-PtrialumPgsAchievement_first_plant=$PGS_ACH_FIRST_PLANT")
          [ -n "$PGS_ACH_LEARNED" ] && args+=("-PtrialumPgsAchievement_learned=$PGS_ACH_LEARNED")
          [ -n "$PGS_ACH_ADVANCED" ] && args+=("-PtrialumPgsAchievement_advanced=$PGS_ACH_ADVANCED")
          [ -n "$PGS_ACH_ECOLOGY" ] && args+=("-PtrialumPgsAchievement_ecology=$PGS_ACH_ECOLOGY")
          [ -n "$PGS_ACH_LAB6" ] && args+=("-PtrialumPgsAchievement_lab6=$PGS_ACH_LAB6")
          [ -n "$PGS_ACH_DNA" ] && args+=("-PtrialumPgsAchievement_dna=$PGS_ACH_DNA")
          [ -n "$PGS_BOARD_XP" ] && args+=("-PtrialumPgsLeaderboard_xp=$PGS_BOARD_XP")
          [ -n "$PGS_BOARD_SPECIES" ] && args+=("-PtrialumPgsLeaderboard_species=$PGS_BOARD_SPECIES")
          gradle -p android-template :app:assembleRelease :app:assembleSignqa :app:assembleSigndebug :app:assembleInternalBeta :app:bundleRelease :app:bundleInternalBeta --no-daemon --stacktrace "${args[@]}"

      - name: Verify candidate package identities and version
        run: |
          set -euo pipefail
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          mkdir -p candidates
          for variant in release signqa signdebug internalBeta; do
            apk=$(find "android-template/app/build/outputs/apk/$variant" -name '*.apk' -print -quit)
            test -s "$apk"
            badge=$("$AAPT" dump badging "$apk")
            echo "$badge" | grep -Fq "versionCode='38'"
            case "$variant" in
              release) pkg='com.trialum.ziivaiskra'; ver='1.0'; firebase_app_id="$TRIALUM_FIREBASE_APP_ID" ;;
              signqa) pkg='com.trialum.ziivaiskra.signqa'; ver='1.0-signqa'; firebase_app_id="$TRIALUM_FIREBASE_APP_ID_SIGNQA" ;;
              signdebug) pkg='com.trialum.ziivaiskra.signdebug'; ver='1.0-signdebug'; firebase_app_id="$TRIALUM_FIREBASE_APP_ID_SIGNDEBUG" ;;
              internalBeta) pkg='com.trialum.ziivaiskra'; ver='1.0'; firebase_app_id="$TRIALUM_FIREBASE_APP_ID" ;;
            esac
            echo "$badge" | grep -Fq "package: name='$pkg'"
            echo "$badge" | grep -Fq "versionName='$ver'"
            resources=$("$AAPT" dump --values resources "$apk")
            require_resource_value() {
              key="$1"
              expected="$2"
              if ! printf '%s\n' "$resources" | awk -v key="string/$key" -v expected="$expected" '
                index($0, key) { in_resource = 1; found_key = 1; if (index($0, expected)) found_value = 1; next }
                in_resource && /^resource 0x/ { in_resource = 0 }
                in_resource && index($0, expected) { found_value = 1 }
                END { exit !(found_key && found_value) }
              '; then
                echo "::error::APK $variant does not contain the configured Android resource: $key"
                exit 1
              fi
            }
            require_resource_value trialum_social_api_url "$TRIALUM_SOCIAL_API_URL"
            require_resource_value trialum_firebase_app_id "$firebase_app_id"
            require_resource_value trialum_firebase_project_id "$TRIALUM_FIREBASE_PROJECT_ID"
            require_resource_value trialum_firebase_sender_id "$TRIALUM_FIREBASE_SENDER_ID"
            cp "$apk" "candidates/trialum-$variant-UNSIGNED.apk"
          done
          aab=$(find android-template/app/build/outputs/bundle/release -name '*.aab' -print -quit)
          test -s "$aab"
          unzip -t "$aab" >/dev/null
          cp "$aab" candidates/trialum-release-UNSIGNED.aab
          beta_aab=$(find android-template/app/build/outputs/bundle/internalBeta -name '*.aab' -print -quit)
          test -s "$beta_aab"
          unzip -t "$beta_aab" >/dev/null
          cp "$beta_aab" candidates/trialum-internal-beta-UNSIGNED.aab

      - uses: actions/upload-artifact@v4
        with:
          name: trialum-lw-c-unsigned-local-signing-candidates
          path: candidates/*
          if-no-files-found: error
          retention-days: 7
